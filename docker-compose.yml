version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: file_storage_postgres
    environment:
      POSTGRES_USER: nimbusfs
      POSTGRES_PASSWORD: nimbusfs
      POSTGRES_DB: nimbusfs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: file_storage_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    container_name: file_storage_app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ENVIRONMENT=development
      - POSTGRES_USER=nimbusfs
      - POSTGRES_PASSWORD=nimbusfs
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=nimbusfs
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key}
      # Phase 4: distributed backend identity. INSTANCE_ID is left unset
      # here deliberately — Settings generates a fresh one per process
      # start, which is exactly what we want even for a single-container
      # compose setup (restart the container, get a new identity).
      - BUILD_VERSION=${BUILD_VERSION:-dev-local}
      - GIT_COMMIT=${GIT_COMMIT:-unknown}
      - FAIL_FAST_ON_STARTUP=true
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./alembic.ini:/app/alembic.ini
      - ./alembic:/app/alembic
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
    restart: unless-stopped

volumes:
  postgres_data:
