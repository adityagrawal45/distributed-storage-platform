version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: nimbusfs-api:latest
    container_name: nimbusfs-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    networks:
      - nimbusfs-network

  db:
    image: postgres:16-alpine
    container_name: nimbusfs-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nimbusfs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nimbusfs}
      POSTGRES_DB: ${POSTGRES_DB:-nimbusfs}
    ports:
      - "5432:5432"
    volumes:
      - nimbusfs-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nimbusfs}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nimbusfs-network

  redis:
    image: redis:7-alpine
    container_name: nimbusfs-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - nimbusfs-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nimbusfs-network

volumes:
  nimbusfs-postgres-data:
  nimbusfs-redis-data:

networks:
  nimbusfs-network:
    driver: bridge
