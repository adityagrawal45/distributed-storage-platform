[tool.ruff]
target-version = "py312"
line-length = 120
# Alembic migrations are largely Alembic-autogenerated boilerplate
# (see each file's own `alembic revision --autogenerate` provenance
# comment) — excluded from lint the same way [tool.mypy] below already
# excludes them, rather than hand-editing generated code to satisfy a
# linter it was never written against.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# Curated selection, added in Phase 12 alongside CI. No ruff/mypy config
# was ever committed in Phases 1-11 despite `# noqa: BLE001`/`PLC0415`/
# `PERF203`/`B014` comments scattered through the codebase implying a
# broader ruleset was always intended locally — this file makes that
# intent explicit and reproducible in CI instead of ambient/whatever a
# given ruff version defaults to.
#
# E/F/W   - pycodestyle + pyflakes (correctness/style baseline)
# I       - isort (import sorting/grouping)
# UP      - pyupgrade (modern Python 3.12 syntax, e.g. `X | None` over `Optional[X]`)
# B       - flake8-bugbear (real bug patterns, e.g. mutable default args)
# SIM     - flake8-simplify (redundant control flow)
# RUF     - ruff-native checks (e.g. unused `noqa`, unsorted `__all__`)
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "SIM", "RUF"]

# Deliberately NOT selected, and why (see docs/ci-cd.md "Lint scope"):
# - BLE001 (flake8-blind-except) / S110 (flake8-bandit try-except-pass):
#   the codebase has ~35 broad `except Exception` sites. Most are a
#   documented, deliberate "log, never raise" degradation contract
#   (CacheService, RateLimiter, health checks, workers' best-effort
#   telemetry) — real code, not sloppiness — but auditing every site
#   individually to annotate it correctly (several already-added
#   annotations during this same phase turned out to be wrong once
#   re-checked — see docs/ci-cd.md) is a properly-scoped follow-up, not
#   something to rush through while standing up CI itself. Tracked as a
#   real, open gap rather than silently ignored.
# - S (flake8-bandit) generally: `bandit` runs as its own dedicated CI
#   step (security-focused, broader AST checks than ruff's port of it)
#   — enabling ruff's overlapping S subset too would report the same
#   finding twice under two different tools.
ignore = [
    # FastAPI's own DI pattern is `param: X = Depends(...)` — a function
    # call in a default argument is exactly how the framework is meant
    # to be used, not the mutable-default-argument bug B008 exists to
    # catch. Used at nearly every route signature in app/api/.
    "B008",
    # Pure syntax-modernization suggestions (Python 3.12 `StrEnum`,
    # PEP 695 generic syntax) that touch runtime behavior in subtle ways
    # (`StrEnum` changes `repr()`/comparison semantics vs. `str, Enum` —
    # every `EventType`/`FileStatus`-style enum in this codebase relies
    # on the current `str, Enum` behavior for JSON serialization) and
    # were 21+6 findings across the codebase — out of scope for standing
    # up CI itself; a real, deliberate modernization pass, not a quick
    # `--fix`. See docs/ci-cd.md "Lint scope".
    "UP042",
    "UP046",
    "UP047",
    # `contextlib.suppress` vs. `try/except: pass` (SIM105) — 7 sites,
    # each already carrying its own rationale comment for the broad
    # catch; same "needs individual review, not a blanket fix" reasoning
    # as BLE001/S110 above.
    "SIM105",
    # `app/models/__init__.py`'s `__all__` is deliberately grouped by
    # the phase that added each model (with inline `# Phase 8`/
    # `# Phase N` comments), not alphabetized — that grouping is more
    # useful to a reader than sort order, so RUF022 is ignored rather
    # than "fixed" into something less readable.
    "RUF022",
]

[tool.ruff.lint.per-file-ignores]
# Test files intentionally construct fixtures/payloads inline; import
# order there is lower-value to enforce strictly than in application code.
"tests/*" = ["SIM"]

[tool.mypy]
python_version = "3.12"
# Practical, not maximal: the codebase already leans on FastAPI/
# SQLAlchemy 2.0/Pydantic v2's own runtime type contracts rather than
# exhaustive static typing everywhere (e.g. `Any`-typed GCS/Redis SDK
# wrappers in app/database/, by the module docstrings' own admission).
# `--strict` on a fresh pass over 11 phases of untyped-mypy code would
# surface hundreds of findings unrelated to Phase 12's actual goal
# (standing up CI) — this config is intentionally the "catch real
# mistakes" tier, not the "100% annotated" tier. See docs/ci-cd.md.
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
exclude = ["tests/", "alembic/"]

[tool.bandit]
# Skips reviewed and accepted for THIS codebase specifically (not a
# blanket bandit-is-noisy dismissal) — see docs/ci-cd.md "Security
# gates" for the one-line reason each is safe here:
#   B104 (hardcoded bind-all interface): app/core/config/settings.py's
#     HOST=0.0.0.0 default is correct for a containerized service meant
#     to be reached via the Kubernetes Service/Ingress, not a raw host
#     binding exposed directly to the internet.
#   B608 (possible SQL injection via string-built query): every DB
#     access in this codebase goes through SQLAlchemy's ORM/Core query
#     builder (see app/repositories/) — no raw string-interpolated SQL
#     exists; bandit's static AST heuristic occasionally flags
#     f-string-built strings that are never passed to a SQL execution
#     call (e.g. GCS object-name templates in storage_service.py).
#   B105 (hardcoded_password_string): false positive on enum/string
#     literals whose NAME merely contains "token" (`AuditEventType.
#     TOKEN_REFRESH`'s value `"token_refresh"`, etc.) — none is a
#     credential; real secrets (JWT_SECRET_KEY, DB/Redis passwords) are
#     read exclusively from environment/Kubernetes Secrets, never
#     hardcoded (see docs/security/ from Phase 10).
#   B108 (hardcoded_tmp_directory): `Settings.WORKER_HEARTBEAT_FILE_PATH
#     = "/tmp/healthy"` (app/core/config/settings.py) is a liveness-probe
#     marker file written and read by the SAME single process inside
#     ITS OWN container — not a multi-tenant shared-/tmp race the rule
#     exists to catch (see app/workers/runtime.py's heartbeat helper).
#   B311 (random module for crypto): every `random.uniform(...)` call in
#     this codebase is retry/lock-jitter timing (app/core/retry.py,
#     app/core/distributed_lock.py) — explicitly non-cryptographic; a
#     predictable jitter value has no security consequence, only a
#     scheduling one. `app/core/security/tokens.py`/`password.py` (the
#     actual crypto boundary) use `python-jose`/`bcrypt`, never `random`.
#   B101 (assert_used): every site (app/core/retry.py,
#     app/core/distributed_lock.py, plus several added during the
#     Phase 12 mypy pass in app/services/file_upload_service.py,
#     app/services/chunked_upload_service.py, app/api/v1/files/routes.py,
#     app/api/v1/uploads/routes.py) asserts an internal invariant the
#     surrounding code already guarantees structurally (documented
#     inline at each site — most are a query filter or a prior
#     `raise`-on-falsy check mypy can't see across a function/variable
#     boundary) — not input validation, and this image is never run
#     with Python's `-O` flag (see docker/Dockerfile), so
#     assert-stripping is not an actual runtime risk here either.
skips = ["B104", "B608", "B105", "B108", "B311", "B101"]
exclude_dirs = ["tests", "alembic", ".venv", "venv"]
