# NimbusFS local load balancer (Phase 4 demo only).
#
# Stands in for the Google Cloud Load Balancer shown in the Phase 4
# architecture diagram (README §"Updated Architecture Diagram") so the
# "3 stateless FastAPI instances behind a load balancer" claim can
# actually be exercised with `docker compose up --scale` on a laptop,
# without needing a real GCP project or (per Phase 4 scope) Kubernetes.
#
# `least_conn` + passive health checks (`max_fails`/`fail_timeout`) are
# the two things that matter here: requests are sent to whichever
# healthy instance is least busy, and an instance that starts failing
# requests is temporarily taken out of rotation — the same behavior a
# real cloud load balancer provides via its own health checks against
# `/api/v1/ready`.

upstream nimbusfs_backend {
    least_conn;

    server app1:8000 max_fails=3 fail_timeout=10s;
    server app2:8000 max_fails=3 fail_timeout=10s;
    server app3:8000 max_fails=3 fail_timeout=10s;
}

server {
    listen 8000;

    # Real client IP as seen by nginx — forwarded to the app so
    # `app/utils/network.py`'s trusted-proxy IP resolution has something
    # real to trust (see TRUSTED_PROXIES in .env.example).
    location / {
        proxy_pass http://nimbusfs_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Streaming downloads (GET /files/{id}/download) must not be
        # buffered whole into memory by nginx before forwarding.
        proxy_buffering off;
    }
}
