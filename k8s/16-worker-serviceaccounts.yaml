# ---------------------------------------------------------------------
# Worker ServiceAccounts (Phase 8) — one KSA per worker
# ---------------------------------------------------------------------
# Four ServiceAccounts, not one shared "workers" account, and none of
# them reusing the API's `nimbusfs-ksa`. The reason is the single
# cheapest security control available in this architecture: each worker
# is bound (via Workload Identity, exactly as 03-serviceaccount.yaml
# established) to a Google service account holding ONLY the IAM roles
# that worker actually needs.
#
#   worker            | Pub/Sub                          | GCS
#   ------------------|----------------------------------|-------------------
#   outbox-publisher  | publisher on all 3 topics        | none
#   file-worker       | subscriber on file-worker-sub,   | objectViewer
#                     | publisher on file + notification |
#   thumbnail-worker  | subscriber on thumbnail-sub      | objectViewer +
#                     |                                  | objectCreator on
#                     |                                  | the thumbnails/ prefix
#   notification-work | subscriber on notification-sub   | none
#
# Read that table as a blast-radius statement rather than a
# configuration one. A compromised notification worker cannot read a
# single user's file, because it has no GCS role at all. A compromised
# outbox publisher cannot consume — so it cannot see other users' events
# in flight. Folding these into one account would give every worker the
# union of all four, and the notification worker (the only one that will
# ever talk to a third party, and therefore the most exposed) would
# quietly gain read access to every byte in the bucket.
#
# IAM roles are granted on the GSA side with `gcloud`, not here — see
# k8s/README.md "Workload Identity Setup" for the binding commands.
# These annotations are only the KSA->GSA half; applying this file
# without creating the GSAs first leaves the pods unable to authenticate
# (and Pub/Sub calls failing with PERMISSION_DENIED, not with a
# scheduling error, which is worth knowing before debugging one).
#
# Prefix-scoped GCS access for the thumbnail worker (objectCreator on
# `thumbnails/` only, not the whole bucket) is an IAM Conditions
# expression on the GSA binding, since GCS has no per-prefix role. It is
# genuinely worth the extra clause: the thumbnail worker is the one
# component that decodes untrusted user-supplied image bytes, so it is
# the one most likely to be exploited, and the one whose write access
# most needs a ceiling.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nimbusfs-outbox-publisher-ksa
  namespace: nimbusfs
  annotations:
    iam.gke.io/gcp-service-account: nimbusfs-outbox-publisher@<PROJECT_ID>.iam.gserviceaccount.com
  labels:
    app.kubernetes.io/name: nimbusfs
    app.kubernetes.io/component: outbox-publisher
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nimbusfs-file-worker-ksa
  namespace: nimbusfs
  annotations:
    iam.gke.io/gcp-service-account: nimbusfs-file-worker@<PROJECT_ID>.iam.gserviceaccount.com
  labels:
    app.kubernetes.io/name: nimbusfs
    app.kubernetes.io/component: file-worker
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nimbusfs-thumbnail-worker-ksa
  namespace: nimbusfs
  annotations:
    iam.gke.io/gcp-service-account: nimbusfs-thumbnail-worker@<PROJECT_ID>.iam.gserviceaccount.com
  labels:
    app.kubernetes.io/name: nimbusfs
    app.kubernetes.io/component: thumbnail-worker
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nimbusfs-notification-worker-ksa
  namespace: nimbusfs
  annotations:
    iam.gke.io/gcp-service-account: nimbusfs-notification-worker@<PROJECT_ID>.iam.gserviceaccount.com
  labels:
    app.kubernetes.io/name: nimbusfs
    app.kubernetes.io/component: notification-worker
