# ---------------------------------------------------------------------
# ServiceAccount (Phase 5) — GKE Workload Identity binding
# ---------------------------------------------------------------------
# This is the Kubernetes-side half of Workload Identity, the mechanism
# that lets Pods authenticate to Google Cloud APIs (GCS, and Cloud SQL
# if using the Cloud SQL Auth Proxy sidecar) WITHOUT a service-account
# JSON key ever existing inside the container image or a Secret.
#
# The `iam.gke.io/gcp-service-account` annotation is what binds this
# Kubernetes ServiceAccount (KSA) to a Google Cloud IAM service account
# (GSA). This is exactly what `app/database/gcs.py`'s design decision
# ("Application Default Credentials ... resolves to the pod's bound
# Kubernetes service account via Workload Identity") was written to
# anticipate back in Phase 3 — no application code change needed here,
# only this binding plus a one-time `gcloud` setup step (see
# k8s/README.md "Workload Identity Setup").
#
# `automountServiceAccountToken: true` (the default) is fine here
# BECAUSE the Role bound to this KSA (04-rbac.yaml) is genuinely
# minimal — NimbusFS doesn't call the Kubernetes API today, so the
# mounted token is inert. If that ever changes, keep it explicit rather
# than assuming.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nimbusfs-ksa
  namespace: nimbusfs
  annotations:
    # Replace with the real GSA created per k8s/README.md before applying.
    iam.gke.io/gcp-service-account: nimbusfs-app@<PROJECT_ID>.iam.gserviceaccount.com
  labels:
    app.kubernetes.io/name: nimbusfs
