# ---------------------------------------------------------------------
# ConfigMap (Phase 5)
# ---------------------------------------------------------------------
# Why a ConfigMap exists at all, vs. baking config into the image: the
# twelve-factor principle NimbusFS has followed since Phase 1
# (app/core/config/settings.py reads everything from env vars) is what
# makes this possible — the SAME container image is promoted unchanged
# from staging to production; only this object (and the Secret) differ
# per environment. Rebuilding an image to change a log level or a
# bucket name would violate immutable-infrastructure practice and
# reintroduce exactly the "which build is this, really?" ambiguity
# Phase 4's BUILD_VERSION/GIT_COMMIT fields exist to eliminate.
#
# Everything here is NON-sensitive by definition — hostnames, feature
# flags, tuning knobs. Anything an attacker reading this object could
# use to directly compromise the system (passwords, signing keys)
# belongs in 06-secret instead. `POSTGRES_HOST`/`REDIS_HOST` point at
# Cloud SQL's private IP and Memorystore's private IP respectively
# (both reachable over the cluster's VPC — see k8s/README.md "Cluster
# Networking") — never public endpoints.
#
# Consumed via `envFrom.configMapRef` in the Deployment, so adding a new
# key here never requires touching 07-deployment.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nimbusfs-config
  namespace: nimbusfs
data:
  # --- Application ---
  APP_NAME: "NimbusFS"
  APP_VERSION: "0.1.0"
  ENVIRONMENT: "production"
  DEBUG: "false"
  API_V1_PREFIX: "/api/v1"

  # --- Server ---
  HOST: "0.0.0.0"
  PORT: "8000"

  # --- JWT (non-secret tuning only — JWT_SECRET_KEY lives in the Secret) ---
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "15"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"
  JWT_ISSUER: "nimbusfs"

  # --- CORS / Hosts ---
  # Tighten to the real frontend origin(s) before going live.
  CORS_ALLOWED_ORIGINS: "https://app.nimbusfs.example.com"
  ALLOWED_HOSTS: "api.nimbusfs.example.com"

  # --- PostgreSQL (Cloud SQL private IP — replace with the real instance) ---
  POSTGRES_HOST: "10.0.0.3"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "nimbusfs"
  DATABASE_POOL_SIZE: "10"
  DATABASE_MAX_OVERFLOW: "20"
  DATABASE_ECHO: "false"

  # --- Redis (Memorystore private IP — replace with the real instance) ---
  REDIS_HOST: "10.0.0.4"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_MAX_CONNECTIONS: "20"

  # --- Logging ---
  LOG_LEVEL: "INFO"
  LOG_JSON: "true"

  # --- Google Cloud Storage ---
  GCS_PROJECT_ID: "<PROJECT_ID>"
  GCS_BUCKET_NAME: "nimbusfs-files-prod"
  # Left unset deliberately: Workload Identity (03-serviceaccount.yaml)
  # supplies credentials — never set GCS_CREDENTIALS_PATH in cluster.
  SIGNED_URL_EXPIRATION_MINUTES: "15"
  MAX_UPLOAD_SIZE_MB: "100"
  ALLOWED_MIME_TYPES: ""
  BLOCKED_EXTENSIONS: "exe,bat,cmd,msi,dll,com,scr,jar,vbs,ps1,sh,app,apk"

  # --- Distributed Backend (Phase 4) ---
  # INSTANCE_ID/HOSTNAME intentionally absent — generated per-process
  # (see app/core/config/settings.py) and per-pod (HOSTNAME defaults to
  # the pod name automatically inside a container), respectively.
  BUILD_VERSION: "" # injected per-Deployment via Downward API-independent build arg — see k8s/README.md CI/CD notes
  GIT_COMMIT: ""
  TRUSTED_PROXIES: "*" # GKE Ingress's GCLB is the only ingress path — see NetworkPolicy for the actual trust boundary
  IDEMPOTENCY_KEY_TTL_SECONDS: "86400"
  IDEMPOTENCY_LOCK_TIMEOUT_SECONDS: "60"
  LOCK_DEFAULT_TTL_SECONDS: "30"
  LOCK_ACQUIRE_TIMEOUT_SECONDS: "5.0"
  LOCK_RETRY_INTERVAL_SECONDS: "0.1"
  RETRY_MAX_ATTEMPTS: "3"
  RETRY_BASE_DELAY_SECONDS: "0.2"
  RETRY_MAX_DELAY_SECONDS: "2.0"
  FAIL_FAST_ON_STARTUP: "true"
  SHUTDOWN_GRACE_PERIOD_SECONDS: "10.0"

  # --- Distributed Redis Caching & Coordination (Phase 7) ---
  # NOTE (Phase 7): Redis moved from "health-check + locks + idempotency
  # only" to being on the read path of every cached metadata request.
  # Every key below has a safe default in app/core/config/settings.py, so
  # this block is about making production tuning *explicit* rather than
  # implicit — the Deployment consumes this ConfigMap via `envFrom`, so
  # no change to 07-deployment.yaml was needed. Sizing note for
  # Memorystore: total connections = REDIS_MAX_CONNECTIONS x replica
  # count (HPA max is 10, so 200 here) — keep that under the instance's
  # connection limit.
  REDIS_SOCKET_CONNECT_TIMEOUT_SECONDS: "2.0"
  REDIS_SOCKET_TIMEOUT_SECONDS: "2.0"
  REDIS_RETRY_ON_TIMEOUT: "true"
  REDIS_HEALTH_CHECK_INTERVAL_SECONDS: "30"

  CACHE_ENABLED: "true"
  CACHE_KEY_PREFIX: "nimbusfs"
  CACHE_TTL_USER_SECONDS: "900"
  CACHE_TTL_FOLDER_SECONDS: "300"
  CACHE_TTL_FOLDER_CHILDREN_SECONDS: "300"
  CACHE_TTL_FOLDER_BREADCRUMBS_SECONDS: "300"
  CACHE_TTL_FILE_SECONDS: "300"
  CACHE_TTL_FILE_VERSIONS_SECONDS: "300"
  CACHE_TTL_SEARCH_SECONDS: "90"
  CACHE_MAX_VALUE_BYTES: "262144"
  CACHE_SEARCH_MAX_ITEMS: "100"
  CACHE_STAMPEDE_PROTECTION_ENABLED: "true"
  CACHE_STAMPEDE_LOCK_TTL_SECONDS: "5.0"
  CACHE_STAMPEDE_WAIT_SECONDS: "0.5"
  CACHE_STAMPEDE_POLL_INTERVAL_SECONDS: "0.02"
  CACHE_WRITE_GUARD_SECONDS: "0.0"

  RATE_LIMIT_ENABLED: "true"
  # Fail open: a Memorystore outage must not become a fleet-wide 429.
  RATE_LIMIT_FAIL_OPEN: "true"
  RATE_LIMIT_LOGIN_REQUESTS: "10"
  RATE_LIMIT_LOGIN_WINDOW_SECONDS: "60"
  RATE_LIMIT_REGISTER_REQUESTS: "5"
  RATE_LIMIT_REGISTER_WINDOW_SECONDS: "300"
  RATE_LIMIT_METADATA_REQUESTS: "300"
  RATE_LIMIT_METADATA_WINDOW_SECONDS: "60"
  RATE_LIMIT_UPLOAD_INITIATE_REQUESTS: "60"
  RATE_LIMIT_UPLOAD_INITIATE_WINDOW_SECONDS: "60"
  RATE_LIMIT_UPLOAD_COMPLETE_REQUESTS: "60"
  RATE_LIMIT_UPLOAD_COMPLETE_WINDOW_SECONDS: "60"
  RATE_LIMIT_SEARCH_REQUESTS: "60"
  RATE_LIMIT_SEARCH_WINDOW_SECONDS: "60"
  RATE_LIMIT_DEFAULT_REQUESTS: "600"
  RATE_LIMIT_DEFAULT_WINDOW_SECONDS: "60"

  # --- Pub/Sub / Event-Driven Architecture (Phase 8) ---
  # This ONE ConfigMap is shared by the API Deployment and all four
  # worker Deployments (16-21). A separate "worker ConfigMap" was
  # considered and rejected: topic names, the ack deadline and the
  # thumbnail allow-list are shared vocabulary — the producer and the
  # consumer disagreeing about a topic name is a silent, total delivery
  # failure, and two ConfigMaps is exactly how that disagreement happens.
  # The genuinely per-worker values (subscription name, concurrency) are
  # a small `env:` block on each worker Deployment instead, overriding
  # what is set here.
  #
  # PUBSUB_ENABLED is "true" here because in a cluster the workers are
  # deployed; the `false` default in settings.py is about landing the
  # code dark, and the ConfigMap is where that decision is reversed
  # deliberately. Set it back to "false" and re-apply to stop all event
  # traffic without deleting anything — outbox rows accumulate in
  # Postgres and drain when it is flipped back.
  GCP_PROJECT_ID: "<PROJECT_ID>"
  PUBSUB_ENABLED: "true"
  # PUBSUB_EMULATOR_HOST intentionally absent — an emulator host in a
  # real cluster would silently route every event to nowhere.

  FILE_EVENTS_TOPIC: "nimbusfs-file-events"
  UPLOAD_EVENTS_TOPIC: "nimbusfs-upload-events"
  NOTIFICATION_EVENTS_TOPIC: "nimbusfs-notification-events"

  FILE_WORKER_SUBSCRIPTION: "nimbusfs-file-events-file-worker-sub"
  THUMBNAIL_WORKER_SUBSCRIPTION: "nimbusfs-file-events-thumbnail-worker-sub"
  NOTIFICATION_WORKER_SUBSCRIPTION: "nimbusfs-notification-events-notification-worker-sub"

  # Mirrors the dead-letter policy configured on the SUBSCRIPTION in GCP
  # (Pub/Sub owns the real counter; this is for log messages).
  MAX_DELIVERY_ATTEMPTS: "5"
  # Must exceed the p99 processing time of the slowest consumer. The
  # thumbnail worker is that consumer; if its p99 ever approaches 60s,
  # raise this BEFORE raising its replica count, or Pub/Sub will
  # redeliver work that is still in flight and double the load.
  PUBSUB_ACK_DEADLINE: "60"

  OUTBOX_BATCH_SIZE: "100"
  OUTBOX_POLL_INTERVAL: "2.0"
  OUTBOX_RETRY_BASE_DELAY_SECONDS: "2.0"
  OUTBOX_RETRY_MAX_DELAY_SECONDS: "300.0"

  # Default worker runtime; per-worker Deployments override
  # WORKER_CONCURRENCY where their resource profile differs.
  WORKER_CONCURRENCY: "10"
  WORKER_HEARTBEAT_INTERVAL_SECONDS: "10.0"
  # The liveness probe's exec command reads this same path — keep the
  # two in sync or the probe checks a file nothing writes.
  WORKER_HEARTBEAT_FILE_PATH: "/tmp/healthy"
  # Kept below every worker Deployment's terminationGracePeriodSeconds
  # so in-flight messages drain before the kubelet escalates to SIGKILL.
  WORKER_SHUTDOWN_GRACE_SECONDS: "30.0"

  THUMBNAIL_MAX_DIMENSION_PX: "512"
  THUMBNAIL_SUPPORTED_CONTENT_TYPES: "image/jpeg,image/png,image/webp,image/gif"
  THUMBNAIL_OBJECT_PREFIX: "thumbnails"
