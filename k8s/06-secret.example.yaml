# ---------------------------------------------------------------------
# Secret (Phase 5) — TEMPLATE, not a real Secret
# ---------------------------------------------------------------------
# Copy this file to `06-secret.yaml` (already in .gitignore — never
# commit the real one) and fill in real values, OR — preferred, since
# it never puts a plaintext secret in a file on disk at all — create it
# imperatively:
#
#   kubectl create secret generic nimbusfs-secrets \
#     --namespace=nimbusfs \
#     --from-literal=JWT_SECRET_KEY="$(openssl rand -hex 32)" \
#     --from-literal=POSTGRES_PASSWORD="<cloud-sql-password>" \
#     --from-literal=REDIS_PASSWORD="<memorystore-auth-string>"
#
# Why Kubernetes Secrets, and their real limits:
# - `stringData` (below) is a convenience field the API server converts
#   to base64-encoded `data` on write — base64 is ENCODING, not
#   encryption. Anyone with `get secret` RBAC access (or etcd access)
#   can trivially decode it. This manifest's own Role (04-rbac.yaml)
#   deliberately grants the app's own ServiceAccount only `get` on this
#   exact named Secret — that's the real access control, not base64.
# - At rest, GKE encrypts etcd (where Secrets are persisted) by default
#   ("Application-layer Secrets Encryption" / envelope encryption via
#   Cloud KMS on GKE) — this is a cluster-level setting, not something
#   this manifest configures, but it's why "Secrets" are meaningfully
#   safer than "ConfigMap with the same data" despite the same base64
#   encoding at the object level.
# - Future Secret Manager integration: Google Secret Manager + the
#   Secret Manager CSI driver (`secrets-store.csi.x-k8s.io`) lets Pods
#   mount secrets directly from Secret Manager as files, with rotation
#   and audit logging Secret Manager provides natively — a strictly
#   better posture than static Kubernetes Secrets for JWT_SECRET_KEY /
#   POSTGRES_PASSWORD in particular. Deliberately NOT implemented this
#   phase (adds a CSI driver install + IAM binding out of scope for
#   "prepare infrastructure, don't operate a monitoring/secrets stack
#   yet") — this comment is the documented seam for that future work.
apiVersion: v1
kind: Secret
metadata:
  name: nimbusfs-secrets
  namespace: nimbusfs
type: Opaque
stringData:
  JWT_SECRET_KEY: "REPLACE_ME_openssl_rand_hex_32"
  POSTGRES_USER: "nimbusfs"
  POSTGRES_PASSWORD: "REPLACE_ME_cloud_sql_password"
  REDIS_PASSWORD: "REPLACE_ME_memorystore_auth_string_or_empty_if_auth_disabled"
